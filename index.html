<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freshers Day – Event Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="confetti"></div>

<header class="text-center py-4 px-2 hero">
  <h1 class="college">SIR CRREDDY CLG OF ENGINEERING (A)</h1>
  <p class="address">📍 Eluru, W.G.District, A.P</p>
  <h2 class="tagline">🎉 Freshers Party 2026 🎉</h2>
</header>

<main class="container pb-5">
  <!-- Student login box -->
  <section class="glass login-box mx-auto mb-5">
    <div id="loginForm">
      <h4 class="mb-3">🎓 Student Login</h4>
      <div class="row g-2">
        <div class="col-sm-5"><input id="lgAdm" class="form-control" placeholder="Admission No."></div>
        <div class="col-sm-5"><input id="lgName" class="form-control" placeholder="Your Name"></div>
        <div class="col-sm-2 d-grid"><button id="lgBtn" class="btn btn-warning">Login</button></div>
      </div>
    </div>
    <div id="welcome" class="d-none d-flex justify-content-between align-items-center">
      <h5 class="m-0">Welcome, <span id="wName"></span> 👋</h5>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </section>

  <h3 class="text-center text-white mb-4 section-title">Events</h3>
  <div id="events"></div>
</main>

<footer class="text-center text-white-50 pb-4">
  <button class="btn btn-link text-white-50" data-bs-toggle="modal" data-bs-target="#adminModal">Admin Login</button>
</footer>

<!-- Registration modal -->
<div class="modal fade" id="regModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form id="regForm" novalidate>
      <div class="modal-header"><h5 class="modal-title">Register: <span id="regEventName"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input class="form-control mb-2" id="fAdm" placeholder="Admission Number" required>
        <input class="form-control mb-2" id="fName" placeholder="Full Name" required>
        <select class="form-select mb-2" id="fDept" required>
          <option value="">Department</option>
          <option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option>
          <option>MECH</option><option>CIVIL</option><option>AI&amp;DS</option><option>Other</option>
        </select>
        <input class="form-control mb-2" id="fMobile" placeholder="Mobile Number (10 digits)" inputmode="numeric" maxlength="10" required>
        <input class="form-control mb-2" id="fMail" type="email" placeholder="Email Address" required>
        <div id="regErr" class="text-danger small"></div>
      </div>
      <div class="modal-footer"><button id="regBtn" class="btn btn-primary w-100">Submit Registration</button></div>
    </form>
  </div></div>
</div>

<!-- Confirmation modal -->
<div class="modal fade" id="confModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header bg-success text-white"><h5 class="modal-title">✅ Registration Confirmed</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="confBody"></div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" onclick="window.print()">Print</button>
      <button class="btn btn-success" data-bs-dismiss="modal">Done</button></div>
  </div></div>
</div>

<!-- Admin modal -->
<div class="modal fade" id="adminModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Admin Panel</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div id="adminLogin">
        <input id="adEmail" type="email" class="form-control mb-2" placeholder="Admin email">
        <input id="adPass" type="password" class="form-control mb-2" placeholder="Password">
        <button id="adBtn" class="btn btn-dark">Login</button>
        <div id="adErr" class="text-danger small mt-2"></div>
      </div>
      <div id="adminData" class="d-none">
        <div class="d-flex gap-2 mb-3">
          <select id="adFilter" class="form-select w-auto"></select>
          <button id="adOut" class="btn btn-outline-danger ms-auto">Logout</button>
        </div>
        <div class="table-responsive"><table class="table table-striped table-sm">
          <thead><tr><th>#</th><th>Event</th><th>Adm No</th><th>Name</th><th>Dept</th><th>Mobile</th><th>Email</th></tr></thead>
          <tbody id="adRows"></tbody></table></div>
      </div>
    </div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
